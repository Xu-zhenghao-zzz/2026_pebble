[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbradius"
version = "0.2.0"
description = "Minimal clone-centric spatial perturbation-scale analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PerturbRadius contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "matplotlib>=3.6",
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.9",
]

[project.optional-dependencies]
real = [
  "h5py>=3.8",
]
dev = [
  "build>=1.0",
  "h5py>=3.8",
  "ipykernel>=6",
  "nbclient>=0.8",
  "nbformat>=5.9",
  "pytest>=7",
]

[project.urls]
Repository = "https://github.com/Xu-zhenghao-zzz/2026_pebble"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["perturbradius*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
