name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Execute tutorial
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          path = Path("tutorials/quickstart.ipynb")
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(
              notebook,
              timeout=180,
              kernel_name="python3",
              resources={"metadata": {"path": str(path.parent)}},
          ).execute()
          PY
      - name: Build package
        run: python -m build

